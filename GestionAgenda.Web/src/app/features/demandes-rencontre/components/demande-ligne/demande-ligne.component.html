<article class="ligne">
  <app-badge [label]="demande().urgence" [tone]="tonUrgence()" />
  <span class="sep">|</span>
  <app-badge [label]="demande().priorite" [tone]="tonPriorite()" />
  <span class="sep">|</span>
  <strong>{{ client() }}</strong>
  <span class="sep">|</span>
  <span>{{ jour() }}</span>
  <p class="motif">{{ demande().motif }}</p>
  <p class="meta">{{ statut() }} · {{ demande().societeNom }}</p>
  <div class="actions">
    <a [routerLink]="['/demandes-rencontre', demande().id]">Détail</a>
    @if (actionsRapides() && demande().statut === 'EnAttente') {
      <button type="button" (click)="analyser.emit(demande().id)">Analyser</button>
    }
    @if (actionsRapides() && demande().statut === 'EnAnalyse') {
      <button type="button" (click)="accepter.emit(demande().id)">Accepter</button>
      <a [routerLink]="['/demandes-rencontre', demande().id]" fragment="traitement">Refuser</a>
      <a [routerLink]="['/demandes-rencontre', demande().id]" fragment="traitement">Reporter</a>
    }
  </div>
</article>
