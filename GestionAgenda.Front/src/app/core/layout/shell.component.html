<header class="flex flex-wrap items-center gap-6 border-b-4 border-gold bg-paper px-6 py-3">
  <a routerLink="/demandes-rencontre/file" class="shrink-0">
    <img ngSrc="assets/softwell.png" width="179" height="96" alt="Softwell" priority class="h-12 w-auto" />
  </a>
  <nav class="flex flex-1 flex-wrap gap-4">
    <a routerLink="/demandes-rencontre/file" routerLinkActive="!text-gold-deep" class="font-semibold no-underline">File</a>
    <a routerLink="/demandes-rencontre" routerLinkActive="!text-gold-deep" [routerLinkActiveOptions]="{ exact: true }" class="font-semibold no-underline">Liste</a>
    <a routerLink="/demandes-rencontre/nouvelle" routerLinkActive="!text-gold-deep" class="font-semibold no-underline">Nouvelle demande</a>
  </nav>
  <p class="m-0 text-navy-soft">{{ email() }}</p>
  <button type="button" class="btn-secondaire" (click)="deconnecter()">Quitter</button>
</header>
@if (notifications.message(); as message) {
  <p class="m-0 flex items-center justify-between gap-4 bg-alert px-6 py-3 text-navy" role="status">
    {{ message }}
    <button type="button" class="btn-secondaire" (click)="notifications.effacer()">Fermer</button>
  </p>
}
<main class="mx-auto max-w-6xl p-6">
  <router-outlet />
</main>
