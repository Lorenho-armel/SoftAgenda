<section class="carte mx-auto mt-16 max-w-md">
  <img ngSrc="assets/softwell.png" width="179" height="96" alt="Softwell" priority class="h-16 w-auto" />
  <h1 class="mt-3">Connexion</h1>
  <form class="grille" [formGroup]="form" (ngSubmit)="connecter()">
    <label>E-mail<input formControlName="email" type="email" autocomplete="username" /></label>
    <app-field-error [control]="form.controls.email" />
    <label>Mot de passe<input formControlName="motDePasse" type="password" autocomplete="current-password" /></label>
    <app-field-error [control]="form.controls.motDePasse" />
    <button type="submit">Entrer</button>
  </form>
</section>
