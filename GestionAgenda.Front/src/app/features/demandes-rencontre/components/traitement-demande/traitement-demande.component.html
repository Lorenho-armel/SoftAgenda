<section id="traitement" class="carte grid gap-4">
  <h2>Traitement</h2>
  @if (statut() === 'EnAttente') {
    <button type="button" (click)="analyser()">Prendre en analyse</button>
  }
  @if (statut() === 'EnAnalyse') {
    <button type="button" (click)="accepter()">Accepter</button>
  }
  @if (statut() === 'Reportee') {
    <button type="button" (click)="analyser()">Reprendre en analyse</button>
  }
  @if (statut() === 'Planifiee') {
    <button type="button" (click)="terminer()">Marquer terminée</button>
  }
  @if (statut() === 'EnAnalyse') {
    <form class="grid gap-2.5" [formGroup]="refus" (ngSubmit)="refuser()">
      <h3>Refuser</h3>
      <label>Commentaire<textarea formControlName="commentaire" rows="3"></textarea></label>
      <app-field-error [control]="refus.controls.commentaire" />
      <button type="submit">Refuser</button>
    </form>
    <form class="grid gap-2.5" [formGroup]="report" (ngSubmit)="reporter()">
      <h3>Reporter</h3>
      <label>Commentaire<textarea formControlName="commentaire" rows="3"></textarea></label>
      <app-field-error [control]="report.controls.commentaire" />
      <label>Nouveau début<input formControlName="dateDebutSouhaitee" type="datetime-local" /></label>
      <app-field-error [control]="report.controls.dateDebutSouhaitee" />
      <label>Nouvelle fin<input formControlName="dateFinSouhaitee" type="datetime-local" /></label>
      <app-field-error [control]="report.controls.dateFinSouhaitee" />
      <button type="submit">Reporter</button>
    </form>
  }
</section>
