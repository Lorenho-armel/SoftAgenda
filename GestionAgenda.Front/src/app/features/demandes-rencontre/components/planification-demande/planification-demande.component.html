@if (visible()) {
  <section class="carte" id="planification">
    <h2>Planification</h2>
    <app-calendrier-saisie
      class="mb-4"
      mode="creneau"
      [debut]="form.controls.debutPlanifie.value"
      [dureeMinutes]="dureeMinutes()"
      [fenetre]="fenetre()"
      [evenements]="conflits()"
      (choisir)="choisirCreneau($event)"
    />
    <form class="grille" [formGroup]="form">
      <label>Date et heure<input formControlName="debutPlanifie" type="datetime-local" /></label>
      <app-field-error [control]="form.controls.debutPlanifie" />
      <label>Salle, si nécessaire<input formControlName="salleId" placeholder="Identifiant de salle" /></label>
      <div class="flex flex-wrap gap-3">
        <button type="button" class="btn-secondaire" (click)="controler()">Vérifier les conflits</button>
        <button type="button" (click)="confirmer()" [disabled]="bilan() !== null && !bilan()!.peutPlanifier">{{ confirmerLibelle() }}</button>
      </div>
    </form>
    @if (bilan(); as resultat) {
      <p>{{ resultat.peutPlanifier ? 'Aucun conflit bloquant.' : 'Planification bloquée.' }}</p>
      @for (conflit of resultat.conflits; track conflit.message) {
        <p class="my-1 border-l-4 border-gold bg-alert px-3 py-2">{{ conflit.message }}</p>
      }
    }
  </section>
}
