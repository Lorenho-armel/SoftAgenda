<section class="page">
  <header class="entete-page">
    <p class="surtitre">Gestion</p>
    <h1>Nouvelle demande</h1>
    <p class="sous-titre">Renseignez les informations de la rencontre souhaitée.</p>
  </header>
  <form class="carte grille" [formGroup]="form" (ngSubmit)="enregistrer()">
    @if (alerte()) { <p class="text-sm text-danger">{{ alerte() }}</p> }
    <label>Dirigeant<input formControlName="dirigeantId" placeholder="22222222-2222-2222-2222-222222222222" /></label>
    <app-field-error [control]="form.controls.dirigeantId" />
    <label>Société<input formControlName="societeId" placeholder="11111111-1111-1111-1111-111111111111" /></label>
    <app-field-error [control]="form.controls.societeId" />
    <label>Type
      <select formControlName="type">
        @for (item of types; track item.valeur) { <option [value]="item.valeur">{{ item.libelle }}</option> }
      </select>
    </label>
    <label>Motif<textarea formControlName="motif" rows="3"></textarea></label>
    <app-field-error [control]="form.controls.motif" />
    <label>Début souhaité<input formControlName="dateDebutSouhaitee" type="datetime-local" /></label>
    <app-field-error [control]="form.controls.dateDebutSouhaitee" />
    <label>Fin souhaitée<input formControlName="dateFinSouhaitee" type="datetime-local" /></label>
    <app-field-error [control]="form.controls.dateFinSouhaitee" />
    <label>Durée (minutes)<input formControlName="dureeMinutes" type="number" min="15" max="480" /></label>
    <app-field-error [control]="form.controls.dureeMinutes" />
    <label>Urgence
      <select formControlName="urgence">
        @for (valeur of urgences; track valeur) { <option [value]="valeur">{{ valeur }}</option> }
      </select>
    </label>
    <label>Priorité
      <select formControlName="priorite">
        @for (valeur of priorites; track valeur) { <option [value]="valeur">{{ valeur }}</option> }
      </select>
    </label>
    <label>Salle souhaitée<input formControlName="salleSouhaiteeId" placeholder="66666666-6666-6666-6666-666666666666" /></label>
    <app-field-error [control]="form.controls.salleSouhaiteeId" />
    <div formArrayName="participants" class="grid gap-3">
      <h2>Participants</h2>
      <button type="button" class="btn-secondaire" (click)="ajouterParticipant()">Ajouter</button>
      @for (groupe of form.controls.participants.controls; track $index) {
        <div class="grille" [formGroupName]="$index">
          <label>Utilisateur interne<input formControlName="utilisateurId" /></label>
          <app-field-error [control]="groupe.controls.utilisateurId" />
          <label>Nom externe<input formControlName="nomComplet" /></label>
          <label>E-mail externe<input formControlName="email" type="email" /></label>
          <button type="button" class="btn-secondaire" (click)="retirerParticipant($index)">Retirer</button>
        </div>
      }
    </div>
    <button type="submit">Créer la demande</button>
  </form>
</section>
