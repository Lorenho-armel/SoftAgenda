<p class="m-0">{{ totalCount() }} demande(s)</p>
<div class="flex items-center gap-3">
  <button type="button" class="btn-secondaire" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">Précédent</button>
  <span>Page {{ page() }} / {{ totalPages() || 1 }}</span>
  <button type="button" class="btn-secondaire" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">Suivant</button>
</div>
